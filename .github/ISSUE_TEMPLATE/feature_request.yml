name: Feature request
description: Proponha uma melhoria concreta para o Analogion.
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: need
    attributes:
      label: Necessidade
      description: Que problema ou limitação esta melhoria resolveria?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva a solução desejada sem transformar a issue em um redesign amplo.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Restrições e preservações
      description: O que precisa continuar igual em UX, arquitetura ou comportamento?
