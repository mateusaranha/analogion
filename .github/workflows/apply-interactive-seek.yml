name: Apply interactive progress seek

on:
  push:
    branches:
      - feat/interactive-progress-seek

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/interactive-progress-seek

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Apply focused implementation
        run: |
          python <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()

          old = '''  function switchListening(next: boolean) {\n    setIsListening(next);\n  }\n\n  function selectRecording(index: number, shouldPlay = false) {'''
          new = '''  function switchListening(next: boolean) {\n    setIsListening(next);\n  }\n\n  function seekTo(seconds: number) {\n    if (!progress.duration || !playerRef.current) return;\n    const nextTime = Math.min(Math.max(seconds, 0), progress.duration);\n    playerRef.current.seekTo(nextTime, true);\n    setProgress((value) => ({ ...value, current: nextTime }));\n  }\n\n  function selectRecording(index: number, shouldPlay = false) {'''
          if old not in text:
              raise SystemExit('seek function insertion point not found')
          text = text.replace(old, new, 1)

          old = '''            <div className="compact-progress"><div><span style={{ width: `${progressPercent}%` }} /></div><small>{formatTime(progress.current)} / {formatTime(progress.duration)}</small></div>'''
          new = '''            <div className="compact-progress">\n              <input\n                className="compact-seek"\n                aria-label="Posição da gravação"\n                type="range" min="0" max={progress.duration || 1}\n                value={Math.min(progress.current, progress.duration || 0)}\n                disabled={!progress.duration}\n                onChange={(event) => seekTo(Number(event.target.value))}\n                style={{ "--seek": `${progressPercent}%` } as React.CSSProperties}\n              />\n              <small>{formatTime(progress.current)} / {formatTime(progress.duration)}</small>\n            </div>'''
          if old not in text:
              raise SystemExit('compact progress markup not found')
          text = text.replace(old, new, 1)

          old = '''                onChange={(event) => playerRef.current?.seekTo(Number(event.target.value), true)}'''
          new = '''                onChange={(event) => seekTo(Number(event.target.value))}'''
          if old not in text:
              raise SystemExit('listening seek handler not found')
          text = text.replace(old, new, 1)
          page.write_text(text)

          css = Path('app/globals.css')
          text = css.read_text()
          old = '''.compact-progress { margin-left: 10px; display: flex; align-items: center; gap: 12px; min-width: 0; }\n.compact-progress > div { height: 2px; flex: 1; background: #332c24; overflow: hidden; }\n.compact-progress > div span { display: block; height: 100%; background: #9b7942; }\n.compact-progress small { color: #777064; font-size: .7rem; white-space: nowrap; }'''
          new = '''.compact-progress { margin-left: 10px; display: flex; align-items: center; gap: 12px; min-width: 0; }\n.compact-seek {\n  appearance: none;\n  -webkit-appearance: none;\n  flex: 1;\n  min-width: 0;\n  height: 20px;\n  margin: 0;\n  padding: 0;\n  border: 0;\n  background: linear-gradient(to right, #9b7942 0 var(--seek), #332c24 var(--seek) 100%) center / 100% 2px no-repeat;\n  cursor: pointer;\n}\n.compact-seek:disabled { cursor: default; }\n.compact-seek::-webkit-slider-runnable-track { height: 20px; background: transparent; }\n.compact-seek::-webkit-slider-thumb {\n  -webkit-appearance: none;\n  width: 8px;\n  height: 8px;\n  margin-top: 6px;\n  border: 0;\n  border-radius: 999px;\n  background: #b28d4e;\n  opacity: 0;\n  transition: opacity .15s ease;\n}\n.compact-seek:hover::-webkit-slider-thumb,\n.compact-seek:focus-visible::-webkit-slider-thumb,\n.compact-seek:active::-webkit-slider-thumb { opacity: 1; }\n.compact-seek::-moz-range-track { height: 2px; background: transparent; }\n.compact-seek::-moz-range-progress { background: transparent; }\n.compact-seek::-moz-range-thumb {\n  width: 8px;\n  height: 8px;\n  border: 0;\n  border-radius: 999px;\n  background: #b28d4e;\n  opacity: 0;\n  transition: opacity .15s ease;\n}\n.compact-seek:hover::-moz-range-thumb,\n.compact-seek:focus-visible::-moz-range-thumb,\n.compact-seek:active::-moz-range-thumb { opacity: 1; }\n.compact-progress small { color: #777064; font-size: .7rem; white-space: nowrap; }'''
          if old not in text:
              raise SystemExit('compact progress CSS not found')
          text = text.replace(old, new, 1)
          css.write_text(text)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "feat: make progress bar seekable"
          git push
